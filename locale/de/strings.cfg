[mod-setting-name]
aps-radius=Luftreiniger-Radius (Chunks)
aps-absorption=Luftreiniger-Absorption pro Minute

[mod-setting-description]
aps-radius=Radius in Chunks um jeden Luftreiniger, aus dem Verschmutzung entfernt wird. 0 = nur der eigene Chunk. Verschmutzung wird anteilig entnommen, stark verschmutzte Chunks also am schnellsten gereinigt.
aps-absorption=Gesamte Verschmutzung, die jeder arbeitende Luftreiniger pro Minute entfernt (verteilt auf alle Chunks im Radius). Krastorio-2-Standard: 50.
