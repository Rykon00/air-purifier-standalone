[mod-setting-description]
aps-radius=Radius in tiles around each air purifier. Every chunk whose center lies inside this circle is cleaned; the purifier's own chunk is always included. The circle is shown when placing or selecting a purifier. Requires a restart to change.
aps-absorption=Total pollution each working air purifier removes per minute (spread over all chunks in its radius). Krastorio 2 default: 50.
