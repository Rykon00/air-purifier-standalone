[mod-setting-description]
aps-radius=Radius in chunks around each air purifier from which pollution is absorbed. 0 = only its own chunk. Pollution is taken proportionally from the dirtiest chunks first.
aps-absorption=Total pollution each working air purifier removes per minute (spread over all chunks in its radius). Krastorio 2 default: 50.
